[project]
name = "iphone-safari-mcp"
version = "0.1.0"
description = "MCP server that drives Safari on a physically attached iPhone via safaridriver"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Igor Katkov" }]
keywords = ["mcp", "safari", "ios", "iphone", "safaridriver", "webdriver"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "mcp>=1.2.0",
  "selenium>=4.27",
  "pillow>=10.0",
]

[project.scripts]
iphone-safari-mcp = "iphone_safari_mcp.server:main"

[project.urls]
Homepage = "https://github.com/ikatkov/iphone-safari-mcp"
Issues = "https://github.com/ikatkov/iphone-safari-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iphone_safari_mcp"]
